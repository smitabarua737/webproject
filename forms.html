<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student regisnation</title>
</head>

<body>
<h1>student regisnation form</h1>
    <form action="index.html" target="_self" autocomplete="on" method="post">

        <label>full Name:</label>

        <input type="text" placeholder="Enter your full name" name="fullname" />

        <br><br>

        <label>Email:</label>

        <input type="email" placeholder="Enter your email" name="email" required />

        <br><br>

        <label>Password:</label>

        <input type="password" placeholder="create your password" name="password" required />

        <br><br>

        <label>Gender:</label>

        <input type="radio" name="gender" value="male" />Male

        <input type="radio" name="gender" value="female" />Female

        <br><br>

        <label>department:</label>
        <select name="department">
             <option value="cse">CSE</option>
              <option value="eee">EEE</option> 
              <option value="bba">BBA</option> 
        </select>

        <br><br>

        <label>City:</label>

        <select name="city">
            <option value="dhaka">Dhaka</option>

            <option value="chattogram">Chattogram</option>
            <option value="cumilla">Cumilla</option>
        </select>

        <br><br>

        <label>Agreement:</label>
        <input type="checkbox" name="agree" required />
        I agree to the terms

        <br><br>

        <!-- <label>Message:</label> -->

        <textarea name="message" placeholder="Enter your message"></textarea>

        <br><br>

        <button type="submit">registration</button>
    </form>



</body>

</html>
