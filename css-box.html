<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Box Model</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body{
      font-family: Arial, 
      sans-serif;
       background: #f2f2f2; 
       padding: 30px;
    }

    .box {
      width: 320px;
      padding: 25px;
      border: 4px solid black;
      margin: 30px auto;
      background: lightblue;
     text-align: center;
      border-radius: 10px;
    }
   .box:hover
    { 
      background: skyblue;
     }
  </style>

</head>

<body>

  <div class="box">CSS Box Model</div>

</body>

</html>
