<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Flexbox</title>

  <style>
    * {
      box-sizing: border-box;
    }
    body 
    {
       font-family: Arial,sans-serif;
        background: #f4f4f4; 
        padding: 30px;
       }
        h2
         {
           text-align: center;
            margin-bottom: 25px;
           }

    .container {
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      background: #ddd;
      padding: 25px;
      border-radius: 15px;
    
    }

    .container div {
      flex: 1 1 100px;
      padding: 25px;
      background: steelblue;
      color: white;
      border-radius: 10px;
      font-size: 20px;
       font-weight: bold;
    }
    .container div:hover
     {
       background: darkblue;
        }
  </style>

</head>

<body>

  <h2>CSS Flexbox Example</h2>

  <div class="container">
    <div>item 1</div>
    <div>item 2</div>
    <div>item 3</div>
    <div>item 4</div>
  </div>

</body>

</html>
